<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b1220;--card:#16213a;--line:#2c3c60;--text:#ffffff;--muted:#c2d0e6;--accent:#5fd0ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.8;background:var(--bg)}
  .wrap{max-width:740px;margin:0 auto;padding:56px 20px 72px}
  .eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 10px}
  h1{font-size:clamp(28px,4vw,38px);line-height:1.2;margin:0 0 8px;font-weight:800;color:#fff}
  .meta{color:var(--muted);font-size:15px;margin:0 0 26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px}
  .card p{margin:0 0 16px;color:var(--text)}
  .card p:last-child{margin-bottom:0}
  .card h2{font-size:18px;margin:26px 0 10px;color:#fff}
  ul{margin:0 0 16px;padding-left:20px;color:var(--text)}
  li{margin:4px 0}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:0 0 26px}
  footer{margin-top:26px;color:var(--muted);font-size:14px;text-align:center}
  footer a{color:var(--muted)}
</style><title>DRONE STRIKE ORBIT</title></head>
<body><main class="wrap">
<p class="eyebrow">DRONE STRIKE ORBIT</p>
<h1>Legal &amp; Support</h1>
<div class="rule"></div>
<div class="card">
<p>Documentation for the iOS game <strong>DRONE STRIKE ORBIT</strong>.</p>
<ul><li><a href="./privacy.html">Privacy Policy</a></li><li><a href="./support.html">Support</a></li></ul>
</div>
<footer>&copy; ADA Software</footer>
</main></body></html>
